- name: Baseline for all servers
  hosts: all
  tasks:
    - name: Create admin users
      ansible.builtin.user:
        name: "{{ item }}"
        groups: wheel
        append: true
      loop: "{{ admin_users | default([]) }}"

    - name: Harden SSH (no root login)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: /usr/sbin/sshd -t -f %s
      notify: restart sshd

  handlers:
    - name: restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

- name: Web servers
  hosts: webservers
  serial: 1                       # rolling: one server at a time
  roles:
    - webserver
