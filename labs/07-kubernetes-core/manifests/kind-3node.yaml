# kind create cluster --config kind-3node.yaml --name lab
# disableDefaultCNI lets you install Calico or Cilium yourself in Lab 08.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: false   # set true in Lab 08
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
  - role: worker
  - role: worker
