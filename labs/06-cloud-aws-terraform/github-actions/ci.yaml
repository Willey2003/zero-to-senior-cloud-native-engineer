# Copy to .github/workflows/ci.yaml in your repository.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests
        working-directory: labs/03-bash-git-python/python
        run: |
          pip install -r requirements.txt
          pytest -q tests
      - name: Build image
        run: |
          cp labs/03-bash-git-python/python/{app.py,requirements.txt} labs/04-docker/app/
          docker build -t ghcr.io/${{ github.repository_owner }}/lab-api:${{ github.sha }} labs/04-docker/app
      - name: Scan image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lab-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/lab-api:${{ github.sha }}
