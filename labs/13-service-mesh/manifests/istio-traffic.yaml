apiVersion: networking.istio.io/v1
kind: Gateway
metadata: {name: shop-gateway, namespace: shop}
spec:
  selector: {istio: ingressgateway}
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ["shop.local"]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: api, namespace: shop}
spec:
  host: api
  trafficPolicy:
    connectionPool: {http: {http1MaxPendingRequests: 10, maxRequestsPerConnection: 5}}
    outlierDetection: {consecutive5xxErrors: 3, interval: 10s, baseEjectionTime: 30s}
  subsets:
    - {name: v1, labels: {version: v1}}
    - {name: v2, labels: {version: v2}}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: api, namespace: shop}
spec:
  hosts: ["shop.local", "api"]
  gateways: [shop-gateway, mesh]
  http:
    - match: [{headers: {x-canary: {exact: "true"}}}]
      route: [{destination: {host: api, subset: v2}}]
    - route:
        - {destination: {host: api, subset: v1}, weight: 90}
        - {destination: {host: api, subset: v2}, weight: 10}
      retries: {attempts: 3, perTryTimeout: 2s, retryOn: 5xx,connect-failure}
      timeout: 5s
      # fault: {delay: {percentage: {value: 50}, fixedDelay: 3s}}   # uncomment to practise chaos
