services:
  api:
    build: .
    image: lab-api:v1
    ports: ["8000:8000"]
    environment:
      APP_VERSION: v1
      DB_URL: postgresql://lab:lab@db:5432/lab     # "db" resolves via Docker's built-in DNS
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: lab, POSTGRES_PASSWORD: lab, POSTGRES_DB: lab}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
    networks: [backend]          # not reachable from "frontend"
  cache:
    image: redis:7-alpine
    networks: [backend]
volumes:
  pgdata:
networks:
  frontend:
  backend:
    internal: true               # no internet access from this network
